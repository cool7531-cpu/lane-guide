<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>합류 차로 안내</title>
<style>
/* 레이아웃: 운전 중 한 눈에 보는 단일 화면. 위쪽 큰 숫자(다음 IC·거리), 가운데 CCTV, 아래 상태. */
:root{
  --bg:#0b0f14; --panel:#131a22; --line:#243040; --fg:#e8eef5; --muted:#8a9bb0;
  --accent:#ffb020; --ok:#3ddc84; --warn:#ff5c5c; --blue:#4da3ff;
  --font:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);word-break:keep-all;overflow-wrap:anywhere}
h1{font-size:18px;margin:0;font-weight:700}
h2{font-size:14px;margin:0;color:var(--muted);font-weight:600;letter-spacing:.04em}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer}
button.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--warn);color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input{font:inherit;color:var(--fg);background:#0e1419;border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.view{display:none;flex-direction:column;gap:14px;padding-block:14px;min-height:100%}
.view.active{display:flex}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 160px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0e1419}
.item .name{font-weight:600}
.item .sub{color:var(--muted);font-size:13px}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.go{color:var(--accent);border-color:var(--accent)}
.tag.skip{color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--warn);border-color:var(--warn)}
/* 주행 화면 */
.big{font-size:clamp(40px,14vw,76px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:.38em;font-weight:600;color:var(--muted);margin-left:6px}
.icname{font-size:clamp(22px,7vw,34px);font-weight:700}
.cctv{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line)}
.cctv img{width:100%;height:100%;object-fit:contain;display:block}
.cctv .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:13px;background:rgba(0,0,0,.6);color:#fff}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:#0e1419;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.alert{border-left:4px solid var(--accent);background:#1e1a0e;padding:12px 14px;border-radius:10px;font-size:18px;font-weight:700}
.banner{padding:10px 14px;border-radius:10px;background:#1a2230;color:var(--fg);font-size:14px}
.banner.bad{background:#2a1515;color:#ffb3b3}
.log{font-family:var(--mono);font-size:12px;color:var(--muted);max-height:120px;overflow:auto;white-space:pre-wrap}
label.chk{display:flex;gap:8px;align-items:center}
label.chk input{width:auto;flex:0 0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.topbar button{padding:8px 12px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.alert{animation:pulse 1.2s ease-in-out 3}}
@keyframes pulse{50%{background:#3a2e10}}
</style>
</head>
<body>

<!-- ============ 설정 ============ -->
<section id="v-setup" class="view">
  <div class="topbar"><h1>합류 차로 안내</h1><span class="muted">설정</span></div>
  <div class="card">
    <h2>API 키 (이 폰에만 저장됨)</h2>
    <label>티맵 앱키 (SK open API)<input id="k-tmap" type="password" autocomplete="off" placeholder="appKey"></label>
    <label>국가교통정보센터 CCTV 키<input id="k-its" type="password" autocomplete="off" placeholder="apiKey"></label>
    <label class="chk"><input id="k-show" type="checkbox"> 키 보이기</label>
    <div class="row"><button id="b-savekeys" class="primary grow">저장하고 키 확인</button></div>
    <div id="keys-status" class="muted"></div>
  </div>
  <div class="card">
    <h2>안내 설정</h2>
    <label>안내 거리 (m)<input id="s-dist" type="number" inputmode="numeric" value="2000" min="500" max="5000" step="100"></label>
    <label>안내 문구 ({IC} 자리에 IC 이름이 들어감)<input id="s-phrase" value="{IC} 진입 차량 많은 구간입니다. 왼쪽 차로로 이동하세요."></label>
    <div class="row"><button id="b-testtts" class="grow">음성 테스트</button><button id="b-savepref" class="grow">저장</button></div>
  </div>
  <div class="card">
    <h2>데이터</h2>
    <div class="muted">IC·JCT 좌표 <b id="ic-count">0</b>곳 내장 (한국도로공사, 2026-10-24 기준)</div>
  </div>
  <div class="row"><button id="b-tohome" class="primary grow">목적지 선택으로</button></div>
</section>

<!-- ============ 목적지 ============ -->
<section id="v-home" class="view">
  <div class="topbar"><h1>어디로 갈까요</h1><button id="b-tosetup">설정</button></div>
  <div class="card">
    <div class="row"><input id="q" class="grow" placeholder="목적지 검색 (예: 수원역, 부산역)" enterkeyhint="search"><button id="b-search">검색</button></div>
    <div id="results" class="list"></div>
  </div>
  <div class="card">
    <h2>자주 가는 곳</h2>
    <div id="favs" class="list"><div class="muted">아직 없음. 검색 결과에서 ★ 로 저장.</div></div>
  </div>
  <div class="card">
    <h2>출발지</h2>
    <label class="chk"><input id="start-gps" type="checkbox" checked> 현재 위치에서 출발</label>
    <div class="row"><input id="q-start" class="grow" placeholder="출발지 검색 (집에서 미리 확인할 때)"><button id="b-search-start">검색</button></div>
    <div id="results-start" class="list"></div>
    <div id="start-label" class="muted">출발: 현재 위치</div>
  </div>
</section>

<!-- ============ 경로 확인 ============ -->
<section id="v-route" class="view">
  <div class="topbar"><h1 id="r-title">경로 확인</h1><button id="b-back-home">뒤로</button></div>
  <div id="r-summary" class="banner"></div>
  <div class="card">
    <h2>경로상 IC / JCT</h2>
    <div class="muted">안내 = 지나치는 합류 지점. 진입·진출 지점은 안내하지 않음.</div>
    <div id="r-ics" class="list"></div>
  </div>
  <div class="row">
    <button id="b-drive" class="primary grow">안내 시작 (GPS)</button>
    <button id="b-sim" class="grow">시험 주행 (가상)</button>
  </div>
</section>

<!-- ============ 주행 ============ -->
<section id="v-drive" class="view">
  <div class="topbar"><h1 id="d-dest">주행 중</h1><button id="b-stop" class="danger">종료</button></div>
  <div id="d-alert" class="alert" hidden></div>
  <div class="card">
    <div class="muted" id="d-nextlabel">다음 합류 지점</div>
    <div class="icname" id="d-icname">—</div>
    <div class="big"><span id="d-dist">—</span><small id="d-distunit"></small></div>
  </div>
  <div class="cctv" id="d-cctv" hidden><img id="d-img" alt="합류부 CCTV"><div class="cap" id="d-cap"></div></div>
  <div class="stat">
    <div><b id="d-speed">0</b><span>km/h</span></div>
    <div><b id="d-prog">0.0</b><span>진행 km</span></div>
    <div><b id="d-remain">0</b><span>남은 안내</span></div>
  </div>
  <div id="d-banner" class="banner" hidden></div>
  <div class="log" id="d-log"></div>
</section>

const R = 6371000;
function toXY(lon, lat, lat0){ const k=Math.PI/180; return [ (lon)*k*R*Math.cos(lat0*k), lat*k*R ]; }
function dist(a, b){ // [lon,lat]
  const k=Math.PI/180, dLat=(b[1]-a[1])*k, dLon=(b[0]-a[0])*k, la1=a[1]*k, la2=b[1]*k;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
/** 폴리라인에 점을 투영. 반환 {d: 수직거리 m, along: 누적거리 m, seg: 세그먼트 인덱스} */
function project(poly, cum, p, lat0){
  const P=toXY(p[0],p[1],lat0); let best={d:Infinity,along:0,seg:0};
  for(let i=0;i<poly.length-1;i++){
    const A=toXY(poly[i][0],poly[i][1],lat0), B=toXY(poly[i+1][0],poly[i+1][1],lat0);
    const vx=B[0]-A[0], vy=B[1]-A[1], L2=vx*vx+vy*vy;
    let t = L2===0?0:((P[0]-A[0])*vx+(P[1]-A[1])*vy)/L2; t=Math.max(0,Math.min(1,t));
    const qx=A[0]+t*vx, qy=A[1]+t*vy, d=Math.hypot(P[0]-qx,P[1]-qy);
    if(d<best.d) best={d, along:cum[i]+t*(cum[i+1]-cum[i]), seg:i};
  }
  return best;
}
const isHighway = name => /고속/.test(name||'');

/** 티맵 경로 응답 → {poly, cum, names(세그먼트별 도로명), total, time} */
function buildRoute(geojson){
  const poly=[], names=[]; // names[i] = poly[i]→poly[i+1] 구간의 도로명
  for(const f of geojson.features||[]){
    if(f.geometry.type!=='LineString') continue;
    const nm=f.properties.name||'';
    const cs=f.geometry.coordinates;
    for(let i=0;i<cs.length;i++){
      const c=[+cs[i][0], +cs[i][1]];
      if(poly.length && poly[poly.length-1][0]===c[0] && poly[poly.length-1][1]===c[1]) continue;
      if(poly.length) names.push(nm);
      poly.push(c);
    }
  }
  const cum=[0]; for(let i=1;i<poly.length;i++) cum.push(cum[i-1]+dist(poly[i-1],poly[i]));
  const p0=geojson.features.find(f=>f.geometry.type==='Point')?.properties||{};
  return {poly, cum, names, total:+p0.totalDistance||cum[cum.length-1], time:+p0.totalTime||0};
}
function nameAt(route, along){ // along 지점의 도로명
  const {cum,names}=route; let i=0; while(i<cum.length-2 && cum[i+1]<along) i++; return names[i]||'';
}
/** 경로상 IC 분류. 반환 [{name, along, kind:'pass'|'enter'|'exit'|'switch', lon,lat}] */
function classifyICs(route, icData){
  const {poly,cum}=route; if(poly.length<2) return [];
  const lat0=poly[0][1];
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of poly){ minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]); }
  const pad=0.01, out=new Map();
  for(const [name,lon,lat] of icData){
    if(lon<minX-pad||lon>maxX+pad||lat<minY-pad||lat>maxY+pad) continue;
    const pr=project(poly,cum,[lon,lat],lat0);
    if(pr.d>350) continue;
    if(!isHighway(route.names[pr.seg])) continue;
    const prev=out.get(name); if(prev && prev.d<=pr.d) continue;
    out.set(name,{name,lon,lat,along:pr.along,d:pr.d});
  }
  const list=[...out.values()].sort((a,b)=>a.along-b.along);
  const W=900;
  for(const ic of list){
    const before=nameAt(route, Math.max(0,ic.along-W)), after=nameAt(route, Math.min(route.cum[route.cum.length-1], ic.along+W));
    const hb=isHighway(before), ha=isHighway(after);
    if(!hb && ha) ic.kind='enter';
    else if(hb && !ha) ic.kind='exit';
    else if(hb && ha && before!==after) ic.kind='switch';
    else if(hb && ha) ic.kind='pass';
    else ic.kind='exit';
  }
  return list;
}

/* ===================== API ===================== */
const keys = store.get('keys',{tmap:'',its:''});
async function tmapPOI(q){
  const u=`https://apis.openapi.sk.com/tmap/pois?version=1&searchKeyword=${encodeURIComponent(q)}&count=10&resCoordType=WGS84GEO`;
  const r=await fetch(u,{headers:{appKey:keys.tmap}}); if(!r.ok) throw new Error('POI '+r.status);
  const j=await r.json(); const pois=j?.searchPoiInfo?.pois?.poi||[];
  return pois.map(p=>({name:p.name, addr:[p.upperAddrName,p.middleAddrName,p.lowerAddrName,p.roadName,p.firstBuildNo].filter(Boolean).join(' '),
    lon:+(p.frontLon||p.noorLon), lat:+(p.frontLat||p.noorLat)}));
}
async function tmapRoute(s, e){
  const r=await fetch('https://apis.openapi.sk.com/tmap/routes?version=1',{method:'POST',
    headers:{appKey:keys.tmap,'Content-Type':'application/json',accept:'application/json'},
    body:JSON.stringify({startX:String(s.lon),startY:String(s.lat),endX:String(e.lon),endY:String(e.lat),reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',searchOption:'0'})});
  if(!r.ok) throw new Error('경로 '+r.status); return r.json();
}
async function itsCCTV(lon, lat, box=0.015){
  const u=`https://openapi.its.go.kr:9443/cctvInfo?apiKey=${encodeURIComponent(keys.its)}&type=ex&cctvType=3&minX=${lon-box}&maxX=${lon+box}&minY=${lat-box}&maxY=${lat+box}&getType=json`;
  const r=await fetch(u); if(!r.ok) throw new Error('CCTV '+r.status);
  const j=await r.json(); let d=j?.response?.data||[]; if(!Array.isArray(d)) d=[d];
  return d.map(c=>({name:String(c.cctvname||'').replace(/;$/,''), url:String(c.cctvurl||''), lon:+String(c.coordx).replace(/;/g,''), lat:+String(c.coordy).replace(/;/g,'')}))
    .filter(c=>c.url && isFinite(c.lon)).map(c=>({...c, d:dist([c.lon,c.lat],[lon,lat])})).sort((a,b)=>a.d-b.d);
}

/* ===================== 음성 ===================== */
let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/ko/i.test(v.lang)&&/google|samsung|yuna|sora/i.test(v.name))||vs.find(v=>/ko/i.test(v.lang))||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; if(voice) u.voice=voice; u.rate=1.0; u.volume=1;
  speechSynthesis.speak(u);
}

const pref = store.get('pref',{dist:2000, phrase:'{IC} 진입 차량 많은 구간입니다. 왼쪽 차로로 이동하세요.'});
let favs = store.get('favs',[]);
let dest=null, startPt=null, route=null, ics=[];
let drive=null; // {watchId, timer, announced:Set, prog, wake, sim}

/* ===================== 설정 화면 ===================== */
$('ic-count').textContent=IC.length;
$('k-tmap').value=keys.tmap; $('k-its').value=keys.its;
$('s-dist').value=pref.dist; $('s-phrase').value=pref.phrase;

  keys.tmap=$('k-tmap').value.trim(); keys.its=$('k-its').value.trim(); store.set('keys',keys);

  try{ const c=await itsCCTV(127.10,37.31); res.push(c.length?`CCTV OK (${c.length}대)`:'CCTV 응답 비어있음'); }catch(e){ res.push('CCTV 실패: '+e.message); }
  st.textContent=res.join(' / ');

$('b-tohome').onclick=()=>show('v-home');
$('b-tosetup').onclick=()=>show('v-setup');

/* ===================== 목적지 화면 ===================== */
function renderFavs(){
  const el=$('favs'); el.innerHTML='';
  if(!favs.length){ el.innerHTML='<div class="muted">아직 없음. 검색 결과에서 ★ 로 저장.</div>'; return; }
  favs.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div><div class="name"></div><div class="sub"></div></div><div class="row"><button data-go>출발</button><button data-del title="삭제">✕</button></div>`;
    d.querySelector('.name').textContent=f.name; d.querySelector('.sub').textContent=f.addr;
    d.querySelector('[data-go]').onclick=()=>chooseDest(f);
    d.querySelector('[data-del]').onclick=()=>{ favs.splice(i,1); store.set('favs',favs); renderFavs(); };
    el.appendChild(d);
  });
}
renderFavs();
function renderResults(el, list, onPick, withStar){
  el.innerHTML='';
  if(!list.length){ el.innerHTML='<div class="muted">결과 없음</div>'; return; }
  for(const p of list){
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div><div class="name"></div><div class="sub"></div></div><div class="row">${withStar?'<button data-star>★</button>':''}<button data-go class="primary">선택</button></div>`;
    d.querySelector('.name').textContent=p.name; d.querySelector('.sub').textContent=p.addr;
    d.querySelector('[data-go]').onclick=()=>onPick(p);
    if(withStar) d.querySelector('[data-star]').onclick=()=>{ if(!favs.some(f=>f.name===p.name&&f.lon===p.lon)){ favs.push(p); store.set('favs',favs); renderFavs(); } };
    el.appendChild(d);
  }
}
async function doSearch(inputId, resId, onPick, withStar){
  const q=$(inputId).value.trim(); if(!q) return;
  if(!keys.tmap){ show('v-setup'); $('keys-status').textContent='티맵 키를 먼저 넣으세요'; return; }
  $(resId).innerHTML='<div class="muted">검색 중…</div>';
  try{ renderResults($(resId), await tmapPOI(q), onPick, withStar); }catch(e){ $(resId).innerHTML=`<div class="muted">검색 실패: ${e.message}</div>`; }
}
$('b-search').onclick=()=>doSearch('q','results',chooseDest,true);
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') $('b-search').click(); });
$('b-search-start').onclick=()=>doSearch('q-start','results-start',p=>{ startPt=p; $('start-gps').checked=false; $('start-label').textContent='출발: '+p.name; $('results-start').innerHTML=''; },false);
$('q-start').addEventListener('keydown',e=>{ if(e.key==='Enter') $('b-search-start').click(); });
$('start-gps').onchange=e=>{ if(e.target.checked){ startPt=null; $('start-label').textContent='출발: 현재 위치'; } };

function getPos(opt={}){ return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:5000,...opt})); }

async function chooseDest(p){
  dest=p; $('r-title').textContent=p.name; $('r-summary').textContent='경로 탐색 중…'; $('r-ics').innerHTML=''; show('v-route');
  try{
    let s=startPt;
    if($('start-gps').checked||!s){ const g=await getPos(); s={lon:g.coords.longitude,lat:g.coords.latitude,name:'현재 위치'}; }
    const gj=await tmapRoute(s,p);
    route=buildRoute(gj); ics=classifyICs(route, IC);
    const targets=ics.filter(i=>i.kind==='pass');
    $('r-summary').textContent=`${s.name} → ${p.name} · ${(route.total/1000).toFixed(1)} km · 약 ${Math.round(route.time/60)}분 · 안내 지점 ${targets.length}곳`;
    const el=$('r-ics');
    if(!ics.length) el.innerHTML='<div class="muted">경로에 고속도로 IC가 없습니다.</div>';
    for(const ic of ics){
      const d=document.createElement('div'); d.className='item';
      const kind={pass:['안내','go'],enter:['진입','skip'],exit:['진출','skip'],switch:['노선변경','skip']}[ic.kind];
      d.innerHTML=`<div><div class="name"></div><div class="sub"></div></div><span class="tag ${kind[1]}">${kind[0]}</span>`;
      d.querySelector('.name').textContent=ic.name; d.querySelector('.sub').textContent=`${(ic.along/1000).toFixed(1)} km 지점 · ${nameAt(route,ic.along)}`;
      el.appendChild(d);
    }
  }catch(e){ $('r-summary').textContent='실패: '+e.message; $('r-summary').classList.add('bad'); }
}
$('b-back-home').onclick=()=>show('v-home');

/* ===================== 주행 ===================== */
function fmtDist(m){ return m>=1000? [(m/1000).toFixed(1),'km'] : [String(Math.max(0,Math.round(m/10)*10)),'m']; }
async function startDrive(sim){
  if(!route) return;
  const targets=ics.filter(i=>i.kind==='pass');
  drive={announced:new Set(), prog:0, speed:0, sim, cctvFor:null, cctvTimer:null, offCount:0, lastFix:0};
  $('d-dest').textContent=dest.name; $('d-log').textContent=''; $('d-alert').hidden=true; $('d-banner').hidden=true; $('d-cctv').hidden=true;
  $('d-remain').textContent=targets.length;
  show('v-drive');
  speak(sim?'시험 주행을 시작합니다':'안내를 시작합니다');
  try{ drive.wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&drive&&!drive.wake){ try{drive.wake=await navigator.wakeLock?.request('screen');}catch(e){} } });
  if(sim){
    let along=0; const v=100/3.6; const lat0=route.poly[0][1];
    drive.timer=setInterval(()=>{ along+=v*1; if(along>route.total+500){ stopDrive('도착'); return; } onProgress(along, 100); },1000);
    log('가상 100km/h 로 경로를 따라 이동');
  }else{
    drive.watchId=navigator.geolocation.watchPosition(g=>{
      const p=[g.coords.longitude,g.coords.latitude]; const lat0=route.poly[0][1];
      const pr=project(route.poly,route.cum,p,lat0);
      drive.lastFix=Date.now();
      if(pr.d>250){ drive.offCount++; $('d-banner').hidden=false; $('d-banner').className='banner bad'; $('d-banner').textContent=`경로에서 ${Math.round(pr.d)}m 벗어남`; if(drive.offCount>=6) reroute(p); return; }
      drive.offCount=0; $('d-banner').hidden=true;
      onProgress(pr.along, g.coords.speed!=null? g.coords.speed*3.6 : null);
    }, e=>{ $('d-banner').hidden=false; $('d-banner').className='banner bad'; $('d-banner').textContent='GPS 오류: '+e.message; }, {enableHighAccuracy:true,maximumAge:1000,timeout:20000});
  }
}
let rerouting=false;
async function reroute(p){
  if(rerouting||drive.sim) return; rerouting=true; log('경로 재탐색');
  try{ const gj=await tmapRoute({lon:p[0],lat:p[1]},dest); route=buildRoute(gj); ics=classifyICs(route,IC); drive.announced.clear(); drive.offCount=0; speak('경로를 다시 찾았습니다'); }
  catch(e){ log('재탐색 실패 '+e.message); } finally{ setTimeout(()=>rerouting=false,30000); }
}
function onProgress(along, speedKmh){
  drive.prog=along;
  if(speedKmh!=null) $('d-speed').textContent=Math.round(speedKmh);
  $('d-prog').textContent=(along/1000).toFixed(1);
  const targets=ics.filter(i=>i.kind==='pass');
  const next=targets.find(i=>i.along>along-300);
  const remain=targets.filter(i=>i.along>along-300 && !drive.announced.has(i.name)).length;
  $('d-remain').textContent=remain;
  if(!next){ $('d-icname').textContent='남은 합류 지점 없음'; $('d-dist').textContent='—'; $('d-distunit').textContent=''; $('d-cctv').hidden=true; return; }
  const gap=next.along-along; const [n,u]=fmtDist(gap);
  $('d-icname').textContent=next.name; $('d-dist').textContent=n; $('d-distunit').textContent=u;
  // CCTV: 5km 전부터 가장 가까운 카메라 표시
  if(gap<5000 && drive.cctvFor!==next.name){ drive.cctvFor=next.name; showCCTV(next); }
  // 안내: 설정 거리 전
  if(gap<=pref.dist && gap>200 && !drive.announced.has(next.name)){
    drive.announced.add(next.name);
    const text=pref.phrase.replace('{IC}', next.name.replace(/JCT$/,' 분기점').replace(/IC$/,' 나들목'));
    speak(text); $('d-alert').textContent=text; $('d-alert').hidden=false; log('안내: '+next.name);
    setTimeout(()=>{ if(drive) $('d-alert').hidden=true; }, 25000);
  }
}
async function showCCTV(ic){
  if(!keys.its){ return; }
  clearInterval(drive.cctvTimer);
  const load=async()=>{
    try{
      const cams=await itsCCTV(ic.lon,ic.lat);
      if(!cams.length){ $('d-cctv').hidden=true; log('CCTV 없음: '+ic.name); return; }
      const c=cams[0]; let url=c.url.replace(/^http:\/\//,'https://');
      const img=$('d-img'); img.onerror=()=>{ $('d-cap').textContent=`영상 로드 실패 (${c.name})`; };
      img.src=url+(url.includes('?')?'&':'?')+'t='+Date.now();
      $('d-cap').textContent=`${c.name} · IC에서 ${Math.round(c.d)}m`; $('d-cctv').hidden=false;
    }catch(e){ log('CCTV 오류 '+e.message); }
  };
  await load(); drive.cctvTimer=setInterval(load, 20000);
}
function stopDrive(reason){
  if(!drive) return;
  if(drive.watchId!=null) navigator.geolocation.clearWatch(drive.watchId);
  clearInterval(drive.timer); clearInterval(drive.cctvTimer);
  try{ drive.wake?.release(); }catch(e){}
  speechSynthesis?.cancel(); if(reason) speak(reason==='도착'?'목적지 부근입니다. 안내를 종료합니다':'안내를 종료합니다');
  drive=null; show('v-route');
}
$('b-drive').onclick=()=>startDrive(false);
$('b-sim').onclick=()=>startDrive(true);
$('b-stop').onclick=()=>stopDrive('');

  history.replaceState(null,'',location.pathname);
})();
